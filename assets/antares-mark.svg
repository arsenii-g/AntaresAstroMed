<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Antares: red supergiant (amber and rust tones, not the pinkish red of alerts)
       with its blue companion, Antares B. -->
  <defs>
    <radialGradient id="glow" cx="32" cy="32" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff9a5c" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#b8431f" stop-opacity=".22"/>
      <stop offset="1" stop-color="#5a1a10" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star" cx="29" cy="29" r="15" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff3e0"/>
      <stop offset=".35" stop-color="#ffc58a"/>
      <stop offset=".75" stop-color="#e8743b"/>
      <stop offset="1" stop-color="#a8391b"/>
    </radialGradient>
    <linearGradient id="spikeV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2c2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe2c2"/>
      <stop offset="1" stop-color="#ffe2c2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spikeH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe2c2" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffe2c2"/>
      <stop offset="1" stop-color="#ffe2c2" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <path d="M31.2 2 h1.6 L33 62 h-2 Z" fill="url(#spikeV)" opacity=".85"/>
  <path d="M2 31.2 v1.6 L62 33 v-2 Z" fill="url(#spikeH)" opacity=".85"/>
  <circle cx="32" cy="32" r="13" fill="url(#star)"/>
  <circle cx="32" cy="32" r="13" fill="none" stroke="#ffd9b0" stroke-opacity=".35" stroke-width=".8"/>
  <!-- Antares B -->
  <circle cx="50" cy="15" r="4.5" fill="#9fd4ff" opacity=".25"/>
  <circle cx="50" cy="15" r="2.2" fill="#e6f4ff"/>
</svg>
